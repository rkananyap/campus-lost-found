<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Campus Lost & Found - Login</title>

    <link rel="stylesheet" href="css/style.css">

</head>

<body class="login-body">

    <div class="login-container">

        <div class="login-left">

            <div class="logo-circle">
                🔎
            </div>

            <h1>Campus<br>Lost & Found</h1>

            <p>
                Lost something on campus?
                Found something that belongs to someone?
            </p>

            <div class="feature-box">

                <div>🔐 Secure Login</div>
                <div>📦 Report Items</div>
                <div>🔍 Find Lost Items</div>
                <div>✅ Recover Items</div>

            </div>

        </div>


        <div class="login-card">

            <h2>Welcome Back 👋</h2>

            <p class="login-subtitle">
                Login to your campus account
            </p>

            <form id="loginForm">

                <label>Email Address</label>

                <input
                    type="email"
                    id="email"
                    placeholder="student@campus.com"
                    required
                >

                <label>Password</label>

                <input
                    type="password"
                    id="password"
                    placeholder="Enter password"
                    required
                >

                <button type="submit">
                    Login →
                </button>

                <p id="loginMessage"></p>

            </form>

            <div class="demo-login">

                <strong>Demo Account</strong>

                <br>

                Email:
                student@campus.com

                <br>

                Password:
                123456

            </div>

        </div>

    </div>

    <script src="js/login.js"></script>

</body>

</html>
